name: Migrar el historico a particiones

# DE UN SOLO USO. Parte el historico monolitico de Drive en particiones
# diarias. Despues de correrlo con exito, este workflow ya no hace falta
# y se puede borrar.
#
# Solo se dispara a mano: no tiene cron y el vigilante-central no lo
# vigila, porque no esta en su targets.json. No puede arrancar solo.
#
# Arranca en modo ENSAYO: parte, cuadra las cuentas y NO escribe nada.
# Para escribir de verdad hay que poner "ensayo" en false a proposito.
on:
  workflow_dispatch:
    inputs:
      ensayo:
        description: "true = solo mira y cuadra, no escribe nada en Drive"
        required: true
        default: true
        type: boolean

# Solo lectura: esta migracion escribe en Drive, nunca en el repo. Sin
# contents:write no puede commitear ni publicar nada aunque quisiera.
permissions:
  contents: read

# Que no se cruce con el colector: los dos tocan los mismos archivos de
# Drive y una migracion a medias con una corrida encima seria un lio.
concurrency:
  group: colector-noticias
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio publico
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Descargar el motor privado
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: ${{ secrets.DEV_VAULT_REPOSITORY }}
          ref: main
          ssh-key: ${{ secrets.DEV_VAULT_DEPLOY_KEY }}
          path: private
          sparse-checkout: |
            ${{ secrets.DEV_VAULT_CORE_PATH }}
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'

      - name: Validar configuracion privada
        shell: bash
        env:
          CORE_PATH: ${{ secrets.DEV_VAULT_CORE_PATH }}
        run: |
          set -euo pipefail
          test -n "$CORE_PATH"
          case "$CORE_PATH" in
            /*|*..*) echo "Ruta privada no valida" >&2; exit 1 ;;
          esac
          test -f "private/$CORE_PATH/codigo/migrar_a_particiones.py"
          test -f "private/$CORE_PATH/codigo/particiones.py"
          test -f "private/$CORE_PATH/codigo/drive_client.py"

      - name: Instalar dependencias
        shell: bash
        env:
          CORE_PATH: ${{ secrets.DEV_VAULT_CORE_PATH }}
        run: |
          set -euo pipefail
          python -m pip install --quiet -r "private/$CORE_PATH/requirements.txt"

      - name: Pasar los tests del motor
        # Si los tests no pasan, no se migra: es la ultima oportunidad
        # de frenar antes de tocar el historico.
        shell: bash
        env:
          CORE_PATH: ${{ secrets.DEV_VAULT_CORE_PATH }}
        run: |
          set -euo pipefail
          cd "private/$CORE_PATH"
          python -m unittest discover -s tests -v

      - name: Migrar
        shell: bash
        env:
          CORE_PATH: ${{ secrets.DEV_VAULT_CORE_PATH }}
          UPLOAD_DATA: ${{ secrets.UPLOAD_DATA }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}
          ENSAYO: ${{ inputs.ensayo }}
        run: |
          set -euo pipefail

          if [ "$ENSAYO" = "true" ]; then
            echo "=== MODO ENSAYO: no se escribe nada en Drive ==="
            python "private/$CORE_PATH/codigo/migrar_a_particiones.py" --ensayo
          else
            echo "=== MIGRACION REAL ==="
            python "private/$CORE_PATH/codigo/migrar_a_particiones.py"
          fi

      - name: Recordatorio
        if: success()
        shell: bash
        env:
          ENSAYO: ${{ inputs.ensayo }}
        run: |
          if [ "$ENSAYO" = "true" ]; then
            echo "Fue un ensayo. Si las cuentas cuadran, volve a lanzarlo"
            echo "con ensayo = false."
          else
            echo "Migracion hecha. Ahora:"
            echo "  1. revisa el arbol en Drive (carpetas por ano y mes);"
            echo "  2. lanza una corrida normal del colector;"
            echo "  3. cuando este todo bien, borra a mano el monolito"
            echo "     noticias_historico.csv y este workflow."
          fi
